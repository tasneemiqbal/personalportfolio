<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasneem Iqbal — Product Manager</title>
    <script>
      // GitHub Pages has no SPA rewrite: a direct hit on /about (or a refresh
      // while on it) serves this file instead of the app. Stash the requested
      // path, bounce to the app root, and let main.tsx restore it before the
      // router reads the URL.
      //
      // /v1/ is the archived static site and is NOT a client route, so a miss
      // there is a genuine 404 and must not be bounced into the app.
      (function () {
        var base = '/personalportfolio/';
        var path = location.pathname + location.search + location.hash;
        if (path.indexOf(base + 'v1/') !== 0) {
          sessionStorage.setItem('spa:redirect', path);
        }
        location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
