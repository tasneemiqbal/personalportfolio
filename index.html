<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Restore the path stashed by the generated 404.html. This has to be a
         classic inline script rather than part of the entry module: routes.ts
         calls createBrowserRouter at module scope, and imports are evaluated
         before the importing module's body, so anything in main.tsx runs after
         the router has already snapshotted location and resolved to "/". A
         parser-blocking script in head runs before any deferred module. -->
    <script>
      (function () {
        try {
          var p = sessionStorage.getItem("spa:redirect");
          if (p) {
            sessionStorage.removeItem("spa:redirect");
            history.replaceState(null, "", p);
          }
        } catch (e) {
          /* private mode with storage disabled: fall through to the root */
        }
      })();
    </script>

    <title>Tasneem Iqbal · Product Manager</title>
    <meta
      name="description"
      content="Web Product Manager at Beach Media, shipping across three student publications. Open to Associate PM roles."
    />

    <!-- Social preview. Absolute on purpose: Vite rewrites the base path into
         href and src attributes but not into meta content, so a scraper
         following a relative og:image gets nothing.

         Every one of these points at Cloudflare from BOTH builds, and that is
         the point rather than an oversight. Two hosts serve identical content,
         so exactly one of them has to be named as the real address or search
         engines see duplicates and pick for you. LinkedIn is stricter still: it
         treats og:url as the address of the content, so whatever is written
         here is the link it features, no matter which URL was pasted in. The
         GitHub Pages copy therefore points visitors and crawlers at Cloudflare.

         These are host-invariant for that reason — do not make them follow the
         build's base. If a custom domain is added later, all four change to it,
         here, once. -->
    <link rel="canonical" href="https://tasneem-iqbal.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tasneem Iqbal" />
    <meta property="og:url" content="https://tasneem-iqbal.pages.dev/" />
    <meta property="og:title" content="Tasneem Iqbal · Product Manager" />
    <meta
      property="og:description"
      content="Web Product Manager at Beach Media, shipping across three student publications. Open to Associate PM roles."
    />
    <meta property="og:image" content="https://tasneem-iqbal.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tasneem Iqbal. Product Manager. Engineer." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tasneem Iqbal · Product Manager" />
    <meta
      name="twitter:description"
      content="Web Product Manager at Beach Media, shipping across three student publications. Open to Associate PM roles."
    />
    <meta name="twitter:image" content="https://tasneem-iqbal.pages.dev/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Barlow+Condensed:wght@600;700;800;900&family=DM+Mono:wght@400;500&display=swap"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
